# appimage/AppImageBuilder.yml
# Builds a portable Linux AppImage for IonoBrowser using appimage-builder.
# All dependencies (PyQt6, websockets, requests, pyserial) are installed
# into the AppDir via pip in the GitHub Actions workflow — no apt needed.

version: 1

AppDir:
  path: ./AppDir

  app_info:
    id: com.github.xscode.ionobrowser
    name: IonoBrowser
    icon: ionobrowser
    version: !ENV ${APP_VERSION}
    exec: usr/bin/python3
    exec_args: "$APPDIR/usr/share/ionobrowser/ionobrowser.py $@"

  files:
    include:
      - usr/share/ionobrowser/ionobrowser.py
      - usr/lib/python3/dist-packages

  runtime:
    env:
      PYTHONPATH: "$APPDIR/usr/lib/python3/dist-packages"

AppImage:
  arch: x86_64
