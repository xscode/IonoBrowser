# appimage/AppImageBuilder.yml
# Builds a portable Linux AppImage for IonoBrowser using appimage-builder.
# Docs: https://appimage-builder.readthedocs.io
#
# Python dependencies are installed into the AppDir via pip in the
# GitHub Actions workflow before this file runs — see release.yml.

version: 1

AppDir:
  path: ./AppDir

  app_info:
    id: com.github.xscode.ionobrowser
    name: IonoBrowser
    icon: ionobrowser.svg
    version: !ENV ${APP_VERSION}
    exec: usr/bin/python3
    exec_args: "$APPDIR/usr/share/ionobrowser/ionobrowser.py $@"

  apt:
    arch: amd64
    allow_unauthenticated: true
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
    include:
      - python3
      - python3-pip
      - libpython3-dev
      - libqt6core6
      - libqt6gui6
      - libqt6widgets6
      - libqt6dbus6
      - qt6-qpa-plugins
      - libxcb1
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxkbcommon-x11-0
      - libdbus-1-3
      - libfontconfig1
      - libfreetype6

  files:
    include:
      # Entry point
      - usr/share/ionobrowser/ionobrowser.py
      # The ionobrowser package — all submodules including widgets/
      - usr/share/ionobrowser/ionobrowser/__init__.py
      - usr/share/ionobrowser/ionobrowser/constants.py
      - usr/share/ionobrowser/ionobrowser/helpers.py
      - usr/share/ionobrowser/ionobrowser/models.py
      - usr/share/ionobrowser/ionobrowser/parsers.py
      - usr/share/ionobrowser/ionobrowser/workers.py
      - usr/share/ionobrowser/ionobrowser/mainwindow.py
      - usr/share/ionobrowser/ionobrowser/widgets/__init__.py
      - usr/share/ionobrowser/ionobrowser/widgets/list_tab.py
      - usr/share/ionobrowser/ionobrowser/widgets/sdr_panel.py
      - usr/share/ionobrowser/ionobrowser/widgets/settings_dialog.py
      # Python packages installed by pip
      - usr/lib/python3/dist-packages

  runtime:
    env:
      PYTHONPATH: "$APPDIR/usr/lib/python3/dist-packages:$APPDIR/usr/share/ionobrowser"

AppImage:
  arch: x86_64
  update-information: gh-releases-zsync|xscode|IonoBrowser|latest|IonoBrowser-*x86_64.AppImage.zsync
