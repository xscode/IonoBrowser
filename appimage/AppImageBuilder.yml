# appimage/AppImageBuilder.yml
# Builds a portable Linux AppImage for IonoBrowser using appimage-builder.
# Docs: https://appimage-builder.readthedocs.io
#
# Usage:
#   pip install appimage-builder
#   cd appimage
#   APP_VERSION=0.1.0-beta appimage-builder --recipe AppImageBuilder.yml

version: 1

AppDir:
  path: ./AppDir

  app_info:
    id: com.github.xscode.ionobrowser
    name: IonoBrowser
    icon: ionobrowser
    version: !ENV ${APP_VERSION}
    exec: usr/bin/python3
    exec_args: "$APPDIR/usr/share/ionobrowser/ionobrowser.py $@"

  apt:
    arch: amd64
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
    include:
      - python3
      - python3-pip
      - libpython3-dev
      - libqt6core6
      - libqt6gui6
      - libqt6widgets6
      - libqt6dbus6
      - qt6-qpa-plugins
      - libxcb1
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxkbcommon-x11-0
      - libdbus-1-3
      - libfontconfig1
      - libfreetype6

  files:
    include:
      - usr/share/ionobrowser/ionobrowser.py

  pip:
    requirements:
      - PyQt6
      - websockets
      - requests

  runtime:
    env:
      PYTHONPATH: "$APPDIR/usr/lib/python3/dist-packages"

AppImage:
  arch: x86_64
  name: IonoBrowser-!ENV ${APP_VERSION}-x86_64
  update-information: gh-releases-zsync|xscode|IonoBrowser|latest|IonoBrowser-*x86_64.AppImage.zsync